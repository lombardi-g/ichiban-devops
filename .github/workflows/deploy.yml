name: Build and Deploy Baseball Stats

on:
  push:
    branches: [main]

# Force all actions to run on Node 24 — fixes the Node 20 deprecation warning
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Required permissions for the official GitHub Pages deploy action
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  # ── Job 1: Validate Python data ───────────────────────────────────────────
  validate-stats:
    name: Validate stats data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install pandas

      - name: Run stats validation
        # Script runs from the repo root — appearances.csv must be here too
        run: python calculate_stats.py

  # ── Job 2: Build Angular frontend ────────────────────────────────────────
  build:
    name: Build Angular app
    runs-on: ubuntu-latest
    needs: validate-stats

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular app
        working-directory: frontend
        run: npx ng build --configuration production --base-href /ichiban-devops/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          # angular.json outputPath is "docs" → Angular writes to frontend/docs/browser/
          path: frontend/docs/browser

  # ── Job 3: Deploy to GitHub Pages ────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5