name: Build and Deploy Baseball Stats

on:
  push:
    branches: [main]

# Required permissions for the official GitHub Pages deploy action
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time; don't cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  # ── Job 1: Validate Python data ────────────────────────────────────────────
  validate-stats:
    name: Validate stats data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2        # v4.2.2+ runs on Node 24

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install pandas

      - name: Run stats validation
        # calculate_stats.py is at the repo root, next to the frontend/ folder
        run: python calculate_stats.py

  # ── Job 2: Build Angular frontend ─────────────────────────────────────────
  build:
    name: Build Angular app
    runs-on: ubuntu-latest
    needs: validate-stats

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular app
        working-directory: frontend
        # npx ensures the locally-installed ng CLI is used — no global install needed
        run: npx ng build --configuration production

      # Upload the build output as a Pages artifact (avoids Jekyll entirely)
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          # Angular 21 with outputPath "docs" puts browser files here:
          path: frontend/docs/browser

  # ── Job 3: Deploy to GitHub Pages ─────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5